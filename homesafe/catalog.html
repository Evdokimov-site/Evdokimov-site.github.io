<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — HomeSafe</title>
  <meta name="description" content="Каталог противопожарного оборудования HomeSafe: огнетушители, спреи, ампулы, модули, датчики дыма и комплекты.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head">
      <nav class="crumbs" aria-label="Хлебные крошки"><a href="index.html">Главная</a><span>Каталог</span></nav>
      <h1 id="catalog-title">Каталог</h1>
    </div>

    <div class="chips" id="chips"></div>

    <div class="catalog">
      <aside class="filters" aria-label="Фильтры">
        <div class="filter-group">
          <h4>Категории</h4>
          <div id="f-cats"></div>
        </div>
        <div class="filter-group">
          <h4>Цена, ₽</h4>
          <div class="price-range">
            <input class="field" id="f-min" type="number" min="0" placeholder="от">
            <input class="field" id="f-max" type="number" min="0" placeholder="до">
          </div>
        </div>
        <div class="filter-group">
          <button class="btn btn-outline btn-sm btn-block" type="button" id="reset">Сбросить фильтры</button>
        </div>
      </aside>

      <section>
        <div class="catalog-bar">
          <button class="btn btn-outline btn-sm filters-toggle" type="button">Фильтры</button>
          <span class="count" id="catalog-count"></span>
          <select id="sort" aria-label="Сортировка">
            <option value="popular">Сначала популярные</option>
            <option value="rating">По рейтингу</option>
            <option value="cheap">Сначала дешевле</option>
            <option value="expensive">Сначала дороже</option>
          </select>
        </div>
        <div class="product-grid" id="catalog-grid"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
